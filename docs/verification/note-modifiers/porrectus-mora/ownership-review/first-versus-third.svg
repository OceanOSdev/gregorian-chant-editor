<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560">
<title>Porrectus ownership candidates — Equal outer pitches; first/third on a line</title>
<rect width="1240" height="2040" fill="#fffdf8"/>
<g font-family="Arial, sans-serif" fill="#252525">
<text x="16" y="30" font-size="21" >REVIEW ONLY — no new convention implemented</text>
<text x="16" y="55" font-size="14" >Equal outer pitches; first/third on a line; positions [4, 2, 4]; symbols at 1.5×</text>
<text x="16" y="77" font-size="12" >n1 = left ribbon start; n2 = low endpoint; n3 = upper terminal. Gray additions are editorial, not rhythmic signs.</text>
<text x="16" y="95" font-size="11" >All candidates preserve conventional final-pair singles. C: m[a,b,c] gives dot counts on notes 1, 2, 3; 0 means none.</text>
<text x="205" y="115" font-size="13" >Current trailing</text>
<text x="465" y="115" font-size="13" >A · local groups + leaders</text>
<text x="725" y="115" font-size="13" >B · indexed trailing groups</text>
<text x="985" y="115" font-size="13" >C · trailing + ownership line</text>
